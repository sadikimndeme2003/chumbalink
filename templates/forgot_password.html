{% extends "base.html" %}
{% block title %}Umesahau Nenosiri | ChumbaLink{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <h1 class="text-xl font-bold text-slate-800 mb-2 text-center">Umesahau Nenosiri?</h1>
    <p class="text-sm text-slate-500 text-center mb-6">
        Weka barua pepe na namba ya simu uliyosajili nazo, kisha weka nenosiri jipya.
    </p>
    <form method="post" class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="text-sm text-slate-600">Barua pepe</label>
            <input type="email" name="email" required class="w-full border border-slate-200 rounded-lg px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm text-slate-600">Namba ya simu uliyosajili nayo</label>
            <input type="tel" name="phone" required class="w-full border border-slate-200 rounded-lg px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm text-slate-600">Nenosiri Jipya</label>
            <input type="password" name="new_password" required minlength="6" class="w-full border border-slate-200 rounded-lg px-3 py-2 mt-1">
        </div>
        <button type="submit" class="w-full bg-brand-teal hover:bg-brand-teal-dark text-white rounded-lg py-2.5 font-semibold">
            Badilisha Nenosiri
        </button>
        <p class="text-center text-sm text-slate-500">
            <a href="{{ url_for('auth.login') }}" class="text-brand-teal-dark font-semibold">Rudi kwenye Ingia</a>
        </p>
    </form>
</div>
{% endblock %}
