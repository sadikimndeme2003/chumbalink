{% extends "base.html" %}
{% block title %}Jisajili | ChumbaLink{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <h1 class="text-xl font-bold text-slate-800 mb-6 text-center">Fungua Akaunti</h1>
    <form method="post" class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="text-sm text-slate-600">Wewe ni nani?</label>
            <div class="grid grid-cols-2 gap-3 mt-1">
                <label class="border border-slate-200 rounded-lg p-3 text-sm text-center cursor-pointer has-[:checked]:border-brand-teal has-[:checked]:bg-teal-50">
                    <input type="radio" name="role" value="client" class="mr-1" checked> Mteja (natafuta chumba)
                </label>
                <label class="border border-slate-200 rounded-lg p-3 text-sm text-center cursor-pointer has-[:checked]:border-brand-teal has-[:checked]:bg-teal-50">
                    <input type="radio" name="role" value="owner" class="mr-1"> Mmiliki wa chumba
                </label>
            </div>
        </div>
        <div>
            <label class="text-sm text-slate-600">Jina kamili</label>
            <input type="text" name="full_name" required class="w-full border border-slate-200 rounded-lg px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm text-slate-600">Barua pepe</label>
            <input type="email" name="email" required class="w-full border border-slate-200 rounded-lg px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm text-slate-600">Namba ya simu</label>
            <input type="tel" name="phone" required class="w-full border border-slate-200 rounded-lg px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm text-slate-600">Nenosiri</label>
            <input type="password" name="password" required minlength="6" class="w-full border border-slate-200 rounded-lg px-3 py-2 mt-1">
        </div>
        <button type="submit" class="w-full bg-brand-teal hover:bg-brand-teal-dark text-white rounded-lg py-2.5 font-semibold">Jisajili</button>
        <p class="text-center text-sm text-slate-500">Una akaunti tayari? <a href="{{ url_for('auth.login') }}" class="text-brand-teal-dark font-semibold">Ingia</a></p>
    </form>
</div>
{% endblock %}
